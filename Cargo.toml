[workspace]
resolver = "3"
# One crate today; Python bindings will join it here.
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
authors = ["Francisco Jiménez <jjcfrank@gmail.com>"]
edition = "2024"
# Set by compact-calendar (via opening-hours), which uses VecDeque::push_back_mut.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jjcfrancisco/overrules"
homepage = "https://github.com/jjcfrancisco/overrules"
keywords = ["overture", "gis", "linear-referencing", "routing", "geodesic"]
categories = ["science::geo"]

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
geo = "0.33"
geozero = { version = "0.15", default-features = false, features = ["with-geo", "with-wkb"] }
opening-hours = "2"
parquet = { version = "60", default-features = false, features = ["json", "snap", "zstd"] }
rstar = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restrictions worth having in a library that will grow Python bindings.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
str_to_string = "warn"
use_self = "warn"
# Pedantic lints that cost more than they give here.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
