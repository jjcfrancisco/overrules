[package]
name = "overrules"
version = "0.2.0"
authors = ["Francisco Jiménez <jjcfrank@gmail.com>"]
description = "Evaluate Overture Maps transportation rules (speed limits, access restrictions, prohibited turns) with rule-by-rule explanations"
readme = "README.md"
edition = "2024"
# Set by compact-calendar (via opening-hours), which uses VecDeque::push_back_mut.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jjcfrancisco/overrules"
keywords = ["overture", "gis", "geospatial", "linear-referencing", "transportation"]
categories = ["science::geo"]
include = ["/src", "/examples", "/tests", "/docs/semantics.md", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[features]
default = []
## Read Overture `segment` GeoParquet files.
parquet = ["dep:base64", "dep:geozero", "dep:parquet", "dep:zstd"]

[dependencies]
base64 = { version = "0.23", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
geo = "0.33"
geozero = { version = "0.15", default-features = false, features = ["with-geo", "with-wkb"], optional = true }
opening-hours = "2"
opening-hours-syntax = "2"
parquet = { version = "60", default-features = false, features = ["json", "snap", "zstd"], optional = true }
rstar = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
# Require the patched compression chain even when consumers reuse an older lockfile.
zstd = { version = "0.14.3", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "resolve"
required-features = ["parquet"]

[[example]]
name = "planar_audit"
required-features = ["parquet"]

[[example]]
name = "export"
required-features = ["parquet"]

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A few restriction lints on top of pedantic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
str_to_string = "warn"
use_self = "warn"
# Pedantic lints that cost more than they give here.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
