[package]
name = "overrules-cli"
description = "Command-line interface for overrules: resolve Overture transportation rules, audit linear referencing, serve the explorer"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "science::geo"]

[[bin]]
name = "overrules"
path = "src/main.rs"
doc = false

[features]
default = ["serve"]
## `overrules serve`: the web explorer over HTTP.
serve = ["overrules-explorer/server", "dep:tokio"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
geo.workspace = true
overrules = { workspace = true, features = ["pack", "parquet"] }
overrules-explorer.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[lints]
workspace = true
