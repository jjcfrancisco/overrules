[package]
name = "overrules"
description = "Evaluate Overture Maps transportation rules (speed limits, access, turn restrictions) for any traveller, with provenance, on geodesic linear references"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Read Overture `segment` GeoParquet files.
parquet = ["dep:base64", "dep:geozero", "dep:parquet"]

[dependencies]
base64 = { workspace = true, optional = true }
chrono.workspace = true
geo.workspace = true
geozero = { workspace = true, optional = true }
opening-hours.workspace = true
parquet = { workspace = true, optional = true }
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "resolve"
required-features = ["parquet"]

[[example]]
name = "planar_audit"
required-features = ["parquet"]

[[example]]
name = "export"
required-features = ["parquet"]
