[package]
name = "overrules-explorer"
description = "Web explorer for overrules: a JSON API over the resolver, an embedded map page, and an optional HTTP server"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "web/**/*", "README.md"]

[features]
default = ["server"]
## Serve the page and the API over HTTP (axum + tokio).
server = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
chrono.workspace = true
geo.workspace = true
overrules.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[lints]
workspace = true
